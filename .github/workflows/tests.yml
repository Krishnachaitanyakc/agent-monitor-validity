name: tests

on: [push, pull_request]

permissions:
  contents: read

jobs:
  datapath:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Mutation checks
        run: python tests/mutations.py

  analysis:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install pinned dependencies
        run: "python -m pip install --only-binary=:all: -r analysis/requirements.txt"
      - name: Unit tests
        run: python -m unittest discover -s analysis -v
      - name: Mutation checks
        run: python analysis/mutations.py
